<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALMAQ · Consulta externa</title><style>body{font:18px Arial;background:#f3f6f9;color:#1f2937;margin:16px}main{max-width:600px;margin:auto}h1{background:#1f4e78;color:white;padding:20px;border-radius:12px}input,button{font:inherit;padding:15px;box-sizing:border-box;max-width:100%;margin:5px 0}button{background:#1f4e78;color:white;border:0;border-radius:8px}#resultado{white-space:pre-wrap;background:white;padding:18px;border-radius:12px;line-height:1.6}</style><main><h1>📦 ALMAQ</h1><p>Consulta externa · solo lectura</p><form id="consulta"><input id="codigo" inputmode="numeric" aria-label="Código" value="8408976986"><button>Consultar producto</button></form><p id="estado"></p><div id="resultado"></div><p><a href="scanner.html">Abrir escáner</a></p></main><script>
const endpoint="https://script.google.com/macros/s/AKfycbxo4q-ePIVPeZVlnUTMl51AGCSCwcXeCPpSQciuWFkUbC9hmXoRyDxBsmh5wo0Rcscx/exec";
const form=document.getElementById("consulta"),estado=document.getElementById("estado"),resultado=document.getElementById("resultado");
async function consultar(e){if(e)e.preventDefault();estado.textContent="Consultando ALMAQ…";resultado.textContent="";form.querySelector("button").disabled=true;try{const url=new URL(endpoint);url.searchParams.set("api","producto");url.searchParams.set("codigo",document.getElementById("codigo").value.trim());const response=await fetch(url,{credentials:"omit",redirect:"follow"});if(!response.ok)throw Error("Respuesta de Google: "+response.status);const r=await response.json();if(!r.ok)throw Error(r.mensaje||"Producto no encontrado");const p=r.producto;resultado.textContent=p.producto+"\nCódigo: "+p.codigo+"\nCategoría: "+p.categoria+"\nStock: "+p.stock+"\nMínimo: "+p.minimo+"\nUbicación: "+p.ubicacion;estado.textContent="Conexión correcta · producto localizado";}catch(error){estado.textContent="No se ha podido consultar: "+error.message;}finally{form.querySelector("button").disabled=false;}}
form.addEventListener("submit",consultar);const codigo=new URLSearchParams(location.search).get("codigo");if(codigo)document.getElementById("codigo").value=codigo;consultar();
</script></html>
