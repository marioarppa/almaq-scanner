<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>ALMAQ Móvil v2.0.3 · Escáner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: Arial, Helvetica, sans-serif;
      background: #F3F6F9;
      color: #1F2937;
    }

    .app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .titulo {
      background: #1F4E78;
      color: white;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    .mensaje {
      margin-top: 12px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
    }

    .volver {
      width: 100%;
      min-height: 58px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #666;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="titulo">
    📷 ALMAQ · ESCÁNER · v2.0.3
  </div>

  <div class="card">

    <div id="reader"></div>

    <div id="mensaje" class="mensaje">
      Apunta la cámara al QR del producto.
    </div>

    <button class="volver" onclick="volverALMAQ()">
      📦 ABRIR ALMAQ
    </button>

  </div>

</div>

<script>

  const ALMAQ_URL =
    "https://script.google.com/macros/s/AKfycbz3sYKuzgLp61Gxd2EmTUnau6qKGOAT4IYz4FdPS1w9dVe-cjG1uUjIxnsa6A6qkq-G/exec";

  let terminado = false;

  function codigoDetectado(texto) {

    if (terminado) return;

    terminado = true;

    const codigo = String(texto || "").trim();

    document.getElementById("mensaje").textContent =
      "✅ Código leído: " + codigo;

    if (navigator.vibrate) {
      navigator.vibrate(120);
    }

    setTimeout(function() {

      window.location.href =
        ALMAQ_URL +
        "?codigo=" +
        encodeURIComponent(codigo);

    }, 400);
  }

  function volverALMAQ() {
    window.location.href = ALMAQ_URL;
  }

  const lector = new Html5QrcodeScanner(
    "reader",
    {
      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const ancho =
          Math.min(
            280,
            Math.floor(viewfinderWidth * 0.8)
          );

        return {
          width: ancho,
          height: ancho
        };
      },

      rememberLastUsedCamera: true,

      supportedScanTypes: [
        Html5QrcodeScanType.SCAN_TYPE_CAMERA
      ],

      formatsToSupport: [
        Html5QrcodeSupportedFormats.QR_CODE,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E
      ]
    },
    false
  );

  lector.render(
    codigoDetectado,
    function() {
      // Los intentos sin lectura son normales.
    }
  );

</script>

</body>
</html>
